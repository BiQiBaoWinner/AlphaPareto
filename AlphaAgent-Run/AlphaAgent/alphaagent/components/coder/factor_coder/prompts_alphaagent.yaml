function_lib_description: |-
  (Do NOT use any undeclared variables (such as `n`) in your expression. Only the variables provided in data (e.g., `$open`) and the operations below are allowed in expression.
  The expression syntax is strictly prefix-functional: `Operator(arg1, arg2, ...)`. Do NOT use infix operators like `+`, `-`, `*`, `/`. Use `Add`, `Sub`, `Mul`, `Div` instead.

  ### **Unary Operators** (1 argument: an expression)
  - **Abs(A)**: Absolute value of each element in A.
  - **Log(A)**: Natural logarithm of each element in A.

  ### **Binary Operators** (2 arguments: two expressions)
  - **Add(A, B)**: Element-wise addition of A and B.
  - **Sub(A, B)**: Element-wise subtraction, A minus B.
  - **Mul(A, B)**: Element-wise multiplication of A and B.
  - **Div(A, B)**: Element-wise division, A divided by B.
  - **Greater(A, B)**: Element-wise maximum of A and B.
  - **Less(A, B)**: Element-wise minimum of A and B.

  ### **Rolling Operators** (2 arguments: an expression and a time window n)
  - **Ref(A, n)**: Value of A delayed (shifted back) by n periods.
  - **Mean(A, n)**: Rolling mean of A over the past n days.
  - **Sum(A, n)**: Rolling sum of A over the past n days.
  - **Std(A, n)**: Rolling standard deviation of A over the past n days.
  - **Var(A, n)**: Rolling variance of A over the past n days.
  - **Max(A, n)**: Rolling maximum of A over the past n days.
  - **Min(A, n)**: Rolling minimum of A over the past n days.
  - **Med(A, n)**: Rolling median of A over the past n days.
  - **Mad(A, n)**: Rolling Median Absolute Deviation of A over the past n days.
  - **Delta(A, n)**: Change in value of A over n periods, i.e. A(t) - A(t-n).
  - **WMA(A, n)**: Weighted moving average of A over n periods.
  - **EMA(A, n)**: Exponential moving average of A over n periods.

  ### **Pair Rolling Operators** (3 arguments: two expressions and a time window n)
  - **Cov(A, B, n)**: Rolling covariance between A and B over the past n days.
  - **Corr(A, B, n)**: Rolling correlation between A and B over the past n days.

  ### **Constants**
  Allowed constant values: -30, -10, -5, -2, -1, -0.5, -0.01, 0.01, 0.5, 1, 2, 5, 10, 30

  ### **Time Windows**
  Allowed time window values for rolling operators: 1, 5, 10, 20, 40

  Note that:
  - The expression syntax is strictly prefix-functional: `Operator(arg1, arg2, ...)`. Do NOT use infix operators like `+`, `-`, `*`, `/`. Use `Add`, `Sub`, `Mul`, `Div` instead.
  - Only the variables provided in data (e.g., `$open`) and the operations above are allowed in the factor expression.
  - Do NOT use any undeclared variable or undefined symbols in the expression.

