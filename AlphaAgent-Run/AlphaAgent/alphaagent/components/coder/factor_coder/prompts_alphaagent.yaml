  - **Mad(A, n)**: Rolling Median Absolute Deviation of A over the past n days.
  - **Delta(A, n)**: Change in value of A over n periods.
  - **WMA(A, n)**: Weighted moving average of A over n periods.
  - **EMA(A, n)**: Exponential moving average of A over n periods.

  ### **Pair Rolling Operators** (3 arguments: two expressions + time window n)
  - **Cov(A, B, n)**: Rolling covariance between A and B over the past n days.
  - **Corr(A, B, n)**: Rolling correlation between A and B over the past n days.

